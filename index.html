<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101512">
  <title>Join Solspire</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Tahoma, Verdana, sans-serif;
      background: #101512;
      color: #eef2ec;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(126, 157, 112, 0.16), transparent 38%),
        linear-gradient(180deg, #151d18, #0c100e 75%);
    }

    main {
      width: min(100%, 560px);
      padding: 36px;
      border: 1px solid #4c5c50;
      background: rgba(16, 21, 18, 0.94);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a6b4a7;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 9vw, 58px);
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .summary {
      margin: 15px 0 28px;
      color: #bdc7bd;
      font-size: 16px;
      line-height: 1.55;
    }

    .code-label {
      margin: 0 0 8px;
      color: #8f9c91;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .code-row {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    code {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      padding: 12px 13px;
      border: 1px solid #354139;
      background: #090d0b;
      color: #dfe8dd;
      font: 13px/1.2 Consolas, "Courier New", monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      min-height: 44px;
      border: 1px solid #879b85;
      border-radius: 0;
      background: #dbe5d8;
      color: #172019;
      font: 700 14px Tahoma, Verdana, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #f0f5ee; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #copy {
      width: 76px;
      background: transparent;
      color: #d8e1d6;
    }

    #copy:hover { background: #202a23; }

    .launches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .demo {
      background: transparent;
      color: #d8e1d6;
    }

    .demo:hover { background: #202a23; }

    #status {
      min-height: 20px;
      margin: 17px 0 0;
      color: #9eaaa0;
      font-size: 13px;
      line-height: 1.45;
    }

    #status.error { color: #e0a39a; }

    @media (max-width: 520px) {
      main { padding: 27px 22px; }
      .launches { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Multiplayer invitation</p>
    <h1>Join Solspire</h1>
    <p class="summary">A shared world is waiting. Choose the installed edition of Solspire to connect through Steam.</p>

    <p class="code-label">Join Code</p>
    <div class="code-row">
      <code id="code">No join code</code>
      <button id="copy" type="button">Copy</button>
    </div>

    <div class="launches">
      <button id="full" type="button">Launch Game</button>
      <button id="demo" class="demo" type="button">Launch Game (Demo)</button>
    </div>
    <p id="status" role="status">Steam must be installed and running.</p>
  </main>

  <script>
    (function () {
      "use strict";

      var fullAppId = "5024320";
      var demoAppId = "5024490";
      var rawHash = "";
      try {
        rawHash = window.location.hash.length > 1
          ? decodeURIComponent(window.location.hash.slice(1)).trim()
          : "";
      } catch (error) {
        rawHash = "";
      }
      var match = rawHash.match(/solspire:[A-Za-z0-9_-]{14,179}/i);
      var joinCode = match ? match[0] : "";
      var codeElement = document.getElementById("code");
      var copyButton = document.getElementById("copy");
      var fullButton = document.getElementById("full");
      var demoButton = document.getElementById("demo");
      var status = document.getElementById("status");

      function launch(appId) {
        var encodedCode = encodeURIComponent(joinCode);
        window.location.href = "steam://run/" + appId +
          "//+connect_code%20" + encodedCode + "/";
        status.className = "";
        status.textContent = "Opening Solspire through Steam...";
      }

      if (!joinCode) {
        codeElement.textContent = "Invalid or missing join code";
        copyButton.disabled = true;
        fullButton.disabled = true;
        demoButton.disabled = true;
        status.className = "error";
        status.textContent = "Copy the complete invitation link or enter its Join Code in Solspire's Direct tab.";
        return;
      }

      codeElement.textContent = joinCode;
      fullButton.addEventListener("click", function () { launch(fullAppId); });
      demoButton.addEventListener("click", function () { launch(demoAppId); });
      copyButton.addEventListener("click", function () {
        navigator.clipboard.writeText(joinCode).then(function () {
          status.className = "";
          status.textContent = "Join Code copied.";
        }, function () {
          status.className = "error";
          status.textContent = "Could not copy automatically. Select the Join Code above.";
        });
      });
    }());
  </script>
</body>
</html>
